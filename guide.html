<style>

:root {
  --bg: #f7f2e6; --bg-soft: #ece1c9; --fg: #172443; --muted: #5c6270; --line: rgba(23,36,67,.14);

  --font: 'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif; --mono: 'Fragment Mono', monospace;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); line-height: 1.75; display: flex; flex-direction: column; }
.proto { background: #c4374a; color: #fff; font-size: 12px; text-align: center; padding: 5px 16px; }
header { background: var(--dark); color: var(--dark-fg); padding: 14px 16px 0; }
header .in { max-width: 760px; margin: 0 auto; display: flex; align-items: flex-end; gap: 14px; }
header .duo { display: flex; flex: 0 0 auto; }
header .duo img { width: 76px; height: 76px; object-fit: contain; display: block; }
header .duo img + img { margin-left: -14px; }
header .tt { padding-bottom: 12px; }
header .eyebrow { font: 11px var(--mono); letter-spacing: .26em; color: var(--teal); }
header h1 { font-size: clamp(18px, 4.4vw, 24px); font-weight: 900; line-height: 1.35; }
header p { font-size: 12px; color: #a6a48d; }

main { flex: 1; overflow-y: auto; padding: 18px 16px 8px; }
#log { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.msg { display: flex; gap: 10px; align-items: flex-start; animation: in .35s cubic-bezier(.16,.84,.24,1); }
@keyframes in { from { opacity: 0; transform: translateY(8px); } }
.msg .face { flex: 0 0 48px; height: 48px; border-radius: 50%; overflow: hidden; }
.msg.philo .face { background: var(--philo-soft); }
.msg.numa .face { background: var(--numa-soft); }
.msg .face img { width: 100%; height: 100%; object-fit: contain; }
.msg .body { max-width: min(560px, calc(100% - 58px)); }
.msg .who { font-size: 11px; font-weight: 700; margin-bottom: 2px; }
.msg.philo .who { color: var(--philo); } .msg.numa .who { color: var(--numa); }
.msg .bubble { background: #fff; border: 1px solid var(--line); border-radius: 4px 16px 16px 16px; padding: 9px 14px; font-size: 15px; }
.msg.philo .bubble { border-left: 4px solid var(--philo); }
.msg.numa .bubble { border-left: 4px solid var(--numa); }
.msg .bubble a { color: var(--philo); font-weight: 700; }
.msg .bubble ul { padding-left: 1.2em; margin: 4px 0; }
.msg.user { justify-content: flex-end; }
.msg.user .bubble { background: var(--fg); color: var(--dark-fg); border: 0; border-radius: 16px 4px 16px 16px; }
.typing .bubble { color: var(--muted); letter-spacing: .3em; }
.links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.links a { font-size: 12.5px; text-decoration: none; background: var(--gold); color: var(--dark) !important; padding: 3px 11px; border-radius: 99px; }
.src { font-size: 11px; color: var(--muted); margin-top: 4px; }

footer { background: var(--bg-soft); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
footer .in { max-width: 760px; margin: 0 auto; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: thin; }
.chips button { flex: 0 0 auto; font: 700 13px var(--font); padding: 7px 13px; border: 1px solid var(--line); border-radius: 99px; background: #fff; color: var(--fg); cursor: pointer; }
.chips button:hover, .chips button:focus-visible { background: var(--fg); color: var(--dark-fg); outline: none; }
form { display: flex; gap: 8px; }
form input { flex: 1; min-width: 0; font: 16px var(--font); padding: 10px 14px; border: 1px solid var(--line); border-radius: 99px; background: #fff; color: var(--fg); }
form input:focus { outline: 2px solid var(--philo); outline-offset: 1px; }
form button { font: 700 14px var(--font); padding: 0 18px; border: 0; border-radius: 99px; background: var(--philo); color: #fff; cursor: pointer; }
@media (max-width: 480px) { header .duo img { width: 56px; height: 56px; } header .tt p:last-child { display: none; } header .tt { padding-bottom: 8px; } }
.note { font-size: 11px; color: var(--muted); margin-top: 6px; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; margin-bottom: 8px; }
.tabs button { font: 700 12px var(--font); padding: 5px 2px; white-space: nowrap; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--muted); cursor: pointer; }
.tabs button[aria-selected="true"] { color: var(--fg); border-color: var(--philo); }
.sugg { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.sugg button { font: 700 12.5px var(--font); padding: 4px 11px; border: 1px solid var(--line); border-radius: 99px; background: var(--bg); color: var(--fg); cursor: pointer; }
.sugg button:hover, .sugg button:focus-visible { background: var(--fg); color: var(--dark-fg); outline: none; }
.sugg-label { font-size: 11px; color: var(--muted); margin-top: 8px; }
</style>

const log = document.getElementById('log');
const scroller = document.getElementById('scroll');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

// カタカナ→ひらがな、全角英数→半角、小文字化、空白と記号を除く
function norm(s) {
  return s.normalize('NFKC').toLowerCase()
    .replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60))
    .replace(/[\s、。！？!?・「」（）()]/g, '');
}
// 英字だけのキーワード（x, ai など）は単語として一致したときだけ数える
function hit(t, raw, k) {
  if (/^[a-z]+$/.test(k)) return new RegExp(`(^|[^a-z])${k}([^a-z]|$)`).test(raw);
  return t.includes(k);
}
function find(text) {
  const t = norm(text), raw = text.normalize('NFKC').toLowerCase();
  let best = null, score = 0;
  for (const qa of QA) {
    let s = 0;
    for (const k of qa.keys) { const nk = norm(k); if (hit(t, raw, nk)) s += nk.length; }
    if (s > score) { score = s; best = qa; }
  }
  return best;
}
// 答えられないとき：文字の並び（2文字ずつ）が近い質問を3つまで出す
function bigrams(s) { const b = new Set(); for (let i = 0; i < s.length - 1; i++) b.add(s.slice(i, i + 2)); return b; }
function suggest(text) {
  const g = bigrams(norm(text));
  const scored = QA.map(qa => {
    const h = bigrams(norm(qa.chip + qa.keys.join('')));
    let s = 0; g.forEach(x => { if (h.has(x)) s++; });
    return [s, qa.id];
  }).filter(([s]) => s > 0).sort((a, b) => b[0] - a[0]).slice(0, 3).map(([, id]) => id);
  return scored.length ? scored : ['ssh', 'course', 'club'];
}

function bottom() { scroller.scrollTo({ top: scroller.scrollHeight, behavior: reduce ? 'auto' : 'smooth' }); }
function esc(s) { return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]); }

function addUser(text) {
  const d = document.createElement('div');
  d.className = 'msg user';
  d.innerHTML = `<div class="body"><div class="bubble">${esc(text)}</div></div>`;
  log.appendChild(d); bottom();
}
function addChara(who, html, links, sugg, label) {
  const d = document.createElement('div');
  d.className = 'msg ' + (who === 'p' ? 'philo' : 'numa');
  const ls = links ? `<div class="links">${links.map(([t, u]) =>
    `<a href="${u}"${u.startsWith('http') ? ' target="_blank" rel="noopener"' : ''}>${t}</a>`).join('')}</div>` : '';
  const sg = sugg && sugg.length ? `<p class="sugg-label">${label || 'こんな質問もあるよ'}</p><div class="sugg">${sugg.map(id =>
    `<button type="button" data-id="${id}">${BY_ID[id].chip}</button>`).join('')}</div>` : '';
  d.innerHTML = `<div class="face"><img src="${FACES[who]}" alt=""></div>
    <div class="body"><p class="who">${NAMES[who]}</p><div class="bubble">${html}${ls}${sg}</div></div>`;
  d.querySelectorAll('.sugg button').forEach(b => b.addEventListener('click', () => ask(BY_ID[b.dataset.id].chip)));
  log.appendChild(d); bottom();
}

  const d = document.createElement('div');
  d.className = 'msg typing ' + (who === 'p' ? 'philo' : 'numa');
  d.innerHTML = `<div class="face"><img src="${FACES[who]}" alt=""></div><div class="body"><div class="bubble">…</div></div>`;
  log.appendChild(d); bottom();
  return d;
}

let busy = Promise.resolve();
const wait = ms => new Promise(r => setTimeout(r, reduce ? 0 : ms));
function play(lines, links, sugg, label) {
  busy = busy.then(async () => {
    for (let i = 0; i < lines.length; i++) {
      const [who, html] = lines[i];
      const t = typing(who);
      await wait(Math.min(1400, 350 + html.length * 10));
      t.remove();
      const last = i === lines.length - 1;
      addChara(who, html, last ? links : null, last ? sugg : null, label);
      await wait(250);
    }
  });
}
function ask(text) {
  text = text.trim();
  if (!text) return;
  addUser(text);
  const t = norm(text);
  const qa = find(text);
  if (qa) return play(qa.say, qa.links, qa.rel);
  if (THANKS_KEYS.some(k => t.includes(norm(k))))
    return play([['p', 'どういたしまして。いい問いをありがとうございました、ホー！'], ['n', 'ほかにも気になることがあったら聞いてね！']], null, ['visit', 'contact']);
  if (BYE_KEYS.some(k => t.includes(norm(k))))
    return play([['n', 'またね！ 見学会で会えるのを楽しみにしてるっぱ！'], ['p', 'お待ちしていますね。']]);
  if (HELLO_KEYS.some(k => t.includes(norm(k)))) return play(GREET, null, ['ssh', 'course', 'club']);
  play([
    ['p', 'うーん、その質問にはまだ答えを用意できていません。なぜ、なぜ、なぜ……。'],
    ['n', '近そうな質問を選んでみてほしいっぱ。くわしいことは、学校公式サイトか説明会で先生に聞いてみてね！'] ],
    [['よくある質問（公式）↗', OFFICIAL + 'qa/index.html']], suggest(text), 'もしかして、これのこと？');
}

// 分類タブと質問ボタン
const tabs = document.getElementById('tabs');
const chips = document.getElementById('chips');
function showCat(cat) {
  tabs.querySelectorAll('button').forEach(b => b.setAttribute('aria-selected', b.dataset.cat === cat));
  chips.innerHTML = '';
  for (const qa of QA.filter(q => q.cat === cat)) {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = qa.chip;
    b.addEventListener('click', () => ask(qa.chip));
    chips.appendChild(b);
  }
  chips.scrollLeft = 0;
}
for (const [cat, label] of CATS) {
  const b = document.createElement('button');
  b.type = 'button'; b.role = 'tab'; b.dataset.cat = cat;
  b.textContent = label;
  b.addEventListener('click', () => showCat(cat));
  tabs.appendChild(b);
}
showCat('ssh');
document.getElementById('ask').addEventListener('submit', e => {
  e.preventDefault();
  const q = document.getElementById('q');
  ask(q.value); q.value = '';
});
play(GREET);
</script>
