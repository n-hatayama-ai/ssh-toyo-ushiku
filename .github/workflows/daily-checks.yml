name: Daily Checks

on:
  schedule:
    # 毎日 08:00 UTC = 17:00 JST
    # 注意: schedule はリポジトリのデフォルトブランチ上のワークフローしか起動しない。
    #       automation/daily-checks をマージするまで定時実行は走らない（手動実行は可）。
    - cron: '0 8 * * *'
  workflow_dispatch:

# execution-log.json の push と Issue 作成に必要。
# （リポジトリ設定で GITHUB_TOKEN が read-only の場合、明示しないと push / issue が 403 になる）
permissions:
  contents: write
  issues: write

# 定時実行と手動実行が重なって execution-log.json を奪い合わないようにする。
concurrency:
  group: daily-checks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  daily-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # 重要: Task 3 の aggregate_logs.py が date（重複排除キー）をローカル日付で作るため、
      #       runner 既定の UTC ではなく JST に揃える。
      TZ: Asia/Tokyo
      # 日本語の出力を bash の文字数カウント（${var:0:200}）で壊さないため。
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
      # Claude CLI 本体が読むのは ANTHROPIC_API_KEY。同じ secret を両方に渡す。
      ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
      GMAIL_API_CREDS: ${{ secrets.GMAIL_API_CREDS }}
      # 各スクリプトの最大実行時間（秒）。deadline-check は最大 3 回リトライするため長め。
      MAIL_TIMEOUT_SEC: '300'
      CALENDAR_TIMEOUT_SEC: '300'
      DEADLINE_TIMEOUT_SEC: '600'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # execution-log.json を push し直すため、token を保持する。
          persist-credentials: true
          # push 前に rebase するので shallow clone にしない。
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Claude CLI
        run: |
          npm install -g @anthropic-ai/claude-code
          # インストール後に PATH 上で解決できるか検証する（できなければここで失敗させる）
          command -v claude
          claude --version

      - name: Verify required secrets
        run: |
          missing=0
          if [ -z "${CLAUDE_API_KEY:-}" ]; then
            echo "::warning title=Missing secret::CLAUDE_API_KEY が未設定です。Claude CLI を使う全チェックが失敗します。"
            missing=1
          fi
          if [ -z "${GMAIL_API_CREDS:-}" ]; then
            echo "::warning title=Missing secret::GMAIL_API_CREDS が未設定です。mail-check が失敗する可能性があります。"
            missing=1
          fi
          if [ "$missing" -eq 0 ]; then
            echo "required secrets: OK"
          fi
        continue-on-error: true

      - name: Make check scripts executable
        run: chmod +x scripts/mail-check.sh scripts/calendar-check.sh scripts/deadline-check.sh

      - name: Run mail-check.sh
        id: mail_check
        continue-on-error: true
        run: |
          set +e
          started=$(date +%s)
          output=$(timeout "${MAIL_TIMEOUT_SEC}" ./scripts/mail-check.sh 2>&1)
          exit_code=$?
          duration=$(( $(date +%s) - started ))
          set -e

          # 全文はステップログに残す（GITHUB_OUTPUT には短縮版だけ入れる）
          printf '%s\n' "$output"
          echo "----- exit_code=${exit_code} duration=${duration}s -----"

          # 改行・復帰を空白に潰し、先頭 200 文字だけを output にする。
          # （GITHUB_OUTPUT は 1 行 = 1 値なので改行が混ざると壊れる）
          message=$(printf '%s' "$output" | tail -5 | tr '\r\n' '  ')
          message=${message:0:200}

          if [ "$exit_code" -eq 0 ]; then
            echo "status=ok" >> "$GITHUB_OUTPUT"
            echo "error=" >> "$GITHUB_OUTPUT"
          else
            echo "status=error" >> "$GITHUB_OUTPUT"
            if [ "$exit_code" -eq 124 ]; then
              reason="timeout after ${MAIL_TIMEOUT_SEC}s"
            else
              reason="exit code ${exit_code}"
            fi
            error="${reason}: ${message}"
            echo "error=${error:0:200}" >> "$GITHUB_OUTPUT"
          fi
          echo "message=${message}" >> "$GITHUB_OUTPUT"
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          echo "duration=${duration}" >> "$GITHUB_OUTPUT"

      - name: Run calendar-check.sh
        id: calendar_check
        continue-on-error: true
        run: |
          set +e
          started=$(date +%s)
          output=$(timeout "${CALENDAR_TIMEOUT_SEC}" ./scripts/calendar-check.sh 2>&1)
          exit_code=$?
          duration=$(( $(date +%s) - started ))
          set -e

          printf '%s\n' "$output"
          echo "----- exit_code=${exit_code} duration=${duration}s -----"

          message=$(printf '%s' "$output" | tail -5 | tr '\r\n' '  ')
          message=${message:0:200}

          if [ "$exit_code" -eq 0 ]; then
            echo "status=ok" >> "$GITHUB_OUTPUT"
            echo "error=" >> "$GITHUB_OUTPUT"
          else
            echo "status=error" >> "$GITHUB_OUTPUT"
            if [ "$exit_code" -eq 124 ]; then
              reason="timeout after ${CALENDAR_TIMEOUT_SEC}s"
            else
              reason="exit code ${exit_code}"
            fi
            error="${reason}: ${message}"
            echo "error=${error:0:200}" >> "$GITHUB_OUTPUT"
          fi
          echo "message=${message}" >> "$GITHUB_OUTPUT"
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          echo "duration=${duration}" >> "$GITHUB_OUTPUT"

      - name: Run deadline-check.sh
        id: deadline_check
        continue-on-error: true
        run: |
          set +e
          started=$(date +%s)
          output=$(timeout "${DEADLINE_TIMEOUT_SEC}" ./scripts/deadline-check.sh 2>&1)
          exit_code=$?
          duration=$(( $(date +%s) - started ))
          set -e

          printf '%s\n' "$output"
          echo "----- exit_code=${exit_code} duration=${duration}s -----"

          message=$(printf '%s' "$output" | tail -5 | tr '\r\n' '  ')
          message=${message:0:200}

          if [ "$exit_code" -eq 0 ]; then
            echo "status=ok" >> "$GITHUB_OUTPUT"
            echo "error=" >> "$GITHUB_OUTPUT"
          else
            echo "status=error" >> "$GITHUB_OUTPUT"
            if [ "$exit_code" -eq 124 ]; then
              reason="timeout after ${DEADLINE_TIMEOUT_SEC}s"
            else
              reason="exit code ${exit_code}"
            fi
            error="${reason}: ${message}"
            echo "error=${error:0:200}" >> "$GITHUB_OUTPUT"
          fi
          echo "message=${message}" >> "$GITHUB_OUTPUT"
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          echo "duration=${duration}" >> "$GITHUB_OUTPUT"

      - name: Aggregate logs to execution-log.json
        if: always()
        env:
          SCRIPT_MAIL_STATUS: ${{ steps.mail_check.outputs.status }}
          SCRIPT_MAIL_MESSAGE: ${{ steps.mail_check.outputs.message }}
          SCRIPT_MAIL_ERROR: ${{ steps.mail_check.outputs.error }}
          SCRIPT_MAIL_DURATION: ${{ steps.mail_check.outputs.duration }}
          SCRIPT_CALENDAR_STATUS: ${{ steps.calendar_check.outputs.status }}
          SCRIPT_CALENDAR_MESSAGE: ${{ steps.calendar_check.outputs.message }}
          SCRIPT_CALENDAR_ERROR: ${{ steps.calendar_check.outputs.error }}
          SCRIPT_CALENDAR_DURATION: ${{ steps.calendar_check.outputs.duration }}
          SCRIPT_DEADLINE_STATUS: ${{ steps.deadline_check.outputs.status }}
          SCRIPT_DEADLINE_MESSAGE: ${{ steps.deadline_check.outputs.message }}
          SCRIPT_DEADLINE_ERROR: ${{ steps.deadline_check.outputs.error }}
          SCRIPT_DEADLINE_DURATION: ${{ steps.deadline_check.outputs.duration }}
        run: |
          echo "aggregating as JST date: $(date '+%Y-%m-%d %H:%M:%S %Z')"
          python3 scripts/aggregate_logs.py

      - name: Commit and push execution-log.json
        if: always()
        continue-on-error: true
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add execution-log.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update execution log $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          # 別の実行が先に push している場合に備えて rebase してから push する。
          branch="${GITHUB_REF_NAME}"
          git pull --rebase origin "$branch" || echo "rebase skipped"
          git push origin "HEAD:refs/heads/${branch}"

      - name: Create issue if any check failed
        if: >-
          always() &&
          (steps.mail_check.outputs.status == 'error' ||
           steps.calendar_check.outputs.status == 'error' ||
           steps.deadline_check.outputs.status == 'error')
        uses: actions/github-script@v7
        env:
          # ${{ }} をスクリプト本文に直接埋め込むとスクリプト出力で JS を壊せてしまうため、
          # 値は必ず env 経由で渡す。
          MAIL_STATUS: ${{ steps.mail_check.outputs.status }}
          MAIL_ERROR: ${{ steps.mail_check.outputs.error }}
          CALENDAR_STATUS: ${{ steps.calendar_check.outputs.status }}
          CALENDAR_ERROR: ${{ steps.calendar_check.outputs.error }}
          DEADLINE_STATUS: ${{ steps.deadline_check.outputs.status }}
          DEADLINE_ERROR: ${{ steps.deadline_check.outputs.error }}
          LOG_BRANCH: ${{ github.ref_name }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = process.env.LOG_BRANCH;

            // JST の日付（ワークフローの TZ ではなく明示指定して runner 依存を避ける）
            const date = new Intl.DateTimeFormat('en-CA', {
              timeZone: 'Asia/Tokyo',
              year: 'numeric', month: '2-digit', day: '2-digit',
            }).format(new Date());

            const checks = [
              { name: 'mail-check', status: process.env.MAIL_STATUS, error: process.env.MAIL_ERROR },
              { name: 'calendar-check', status: process.env.CALENDAR_STATUS, error: process.env.CALENDAR_ERROR },
              { name: 'deadline-check', status: process.env.DEADLINE_STATUS, error: process.env.DEADLINE_ERROR },
            ];
            const failed = checks.filter((c) => c.status === 'error');
            if (failed.length === 0) {
              core.info('No failed checks; skipping issue creation.');
              return;
            }

            const names = failed.map((c) => c.name).join(', ');
            const title = `[FAILED] Daily checks failed on ${date}: ${names}`;

            // 同日・同内容の Issue が既にあれば重複作成しない（手動再実行対策）
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'automation-failure', per_page: 100,
            });
            const duplicate = existing.find((issue) => issue.title === title);
            if (duplicate) {
              core.info(`Issue already exists: #${duplicate.number}`);
              return;
            }

            const runUrl = `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${context.runId}`;
            const logUrl = `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/blob/${branch}/execution-log.json`;
            const details = failed
              .map((c) => `- **${c.name}**: ${c.error || '(詳細なし)'}`)
              .join('\n');
            const body = [
              `**Failed scripts:** ${names}`,
              '',
              '### 詳細',
              details,
              '',
              `- Workflow run: ${runUrl}`,
              `- Execution log: ${logUrl}`,
            ].join('\n');

            const payload = { owner, repo, title, body };
            try {
              await github.rest.issues.create({ ...payload, labels: ['automation-failure', 'noboru'] });
            } catch (err) {
              // ラベルが未作成などで失敗した場合はラベル無しで作り直す
              core.warning(`Issue creation with labels failed: ${err.message}. Retrying without labels.`);
              await github.rest.issues.create(payload);
            }

      - name: Summary
        if: always()
        run: |
          {
            echo "| script | status | exit code | duration |"
            echo "| --- | --- | --- | --- |"
            echo "| mail-check | ${{ steps.mail_check.outputs.status }} | ${{ steps.mail_check.outputs.exit_code }} | ${{ steps.mail_check.outputs.duration }}s |"
            echo "| calendar-check | ${{ steps.calendar_check.outputs.status }} | ${{ steps.calendar_check.outputs.exit_code }} | ${{ steps.calendar_check.outputs.duration }}s |"
            echo "| deadline-check | ${{ steps.deadline_check.outputs.status }} | ${{ steps.deadline_check.outputs.exit_code }} | ${{ steps.deadline_check.outputs.duration }}s |"
          } >> "$GITHUB_STEP_SUMMARY"
